name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22.18.0'
  FOUNDATION_VERSION: 'v0.2.0'

jobs:
  # Contract Testing & Deployment
  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDATION_VERSION }}
          
      - name: Install dependencies
        run: |
          cd packages/contracts
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable --no-commit
          
      - name: Build contracts
        run: |
          cd packages/contracts
          forge build
          
      - name: Run tests
        run: |
          cd packages/contracts
          forge test -vv
          
      - name: Run gas snapshots
        run: |
          cd packages/contracts
          forge snapshot
          
      - name: Slither Analysis
        uses: crytic/slither-action@v0.3.0
        id: slither
        with:
          target: 'packages/contracts/src'
          slither-args: '--filter-paths "node_modules/" --exclude naming-convention,external-function'
          
  # SDK Testing
  sdk:
    name: SDK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build SDK
        run: npm run build --filter=sdk
        
      - name: Test SDK
        run: npm run test --filter=sdk
        
      - name: Lint SDK
        run: npm run lint --filter=sdk

  # UI Components
  ui:
    name: UI Components
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build UI
        run: npm run build --filter=ui
        
      - name: Lint UI
        run: npm run lint --filter=ui
        
      - name: Build Storybook
        run: |
          cd packages/ui
          npm run build-storybook

  # Web App
  web:
    name: Web Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build web app
        run: npm run build --filter=web
        
      - name: Lint web app
        run: npm run lint --filter=web
        
      - name: Type check
        run: npm run type-check --filter=web

  # Deployment to Base Sepolia (for PRs and develop branch)
  deploy-testnet:
    name: Deploy to Base Sepolia
    runs-on: ubuntu-latest
    needs: [contracts, sdk, ui, web]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    # environment: testnet # Uncomment after configuring in GitHub Settings > Environments
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDATION_VERSION }}
          
      - name: Install dependencies
        run: |
          cd packages/contracts
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable --no-commit
          
      - name: Deploy to Base Sepolia
        run: |
          cd packages/contracts
          forge script script/Deploy.s.sol:DeployTestnetScript \
            --rpc-url base-sepolia \
            --broadcast \
            --verify \
            -vvvv
        env:
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}

  # Deployment to Base Mainnet (for main branch)
  deploy-mainnet:
    name: Deploy to Base Mainnet
    runs-on: ubuntu-latest
    needs: [contracts, sdk, ui, web]
    if: github.ref == 'refs/heads/main'
    # environment: mainnet # Uncomment after configuring in GitHub Settings > Environments
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDATION_VERSION }}
          
      - name: Install dependencies
        run: |
          cd packages/contracts
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable --no-commit
          
      - name: Deploy to Base Mainnet
        run: |
          cd packages/contracts
          forge script script/Deploy.s.sol:DeployScript \
            --rpc-url base \
            --broadcast \
            --verify \
            -vvvv
        env:
          PRIVATE_KEY: ${{ secrets.MAINNET_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}

  # Deploy Web App to Vercel
  deploy-web:
    name: Deploy Web App
    runs-on: ubuntu-latest
    needs: [contracts, sdk, ui, web]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build web app
        run: npm run build --filter=web
        
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: apps/web
