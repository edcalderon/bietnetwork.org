# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["BIE-1"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Enable Corepack
        run: corepack enable
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build documentation
        run: |
          cd apps/docs
          yarn build
          # Copy docs to web app public directory
          mkdir -p ../web/public/documentation
          cp -r build/* ../web/public/documentation/
      - name: Verify WalletConnect Project ID
        run: |
          echo "🔍 Checking WalletConnect Project ID configuration..."
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          
          if [ -z "${{ secrets.WALLETCONNECT_PROJECT_ID }}" ]; then
            echo ""
            echo "⚠️  WARNING: WALLETCONNECT_PROJECT_ID secret is not set!"
            echo ""
            echo "WalletConnect functionality will not work in production."
            echo ""
            echo "📋 To fix this:"
            echo "1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: WALLETCONNECT_PROJECT_ID (exactly as shown)"
            echo "4. Value: Your WalletConnect project ID from https://cloud.walletconnect.com/"
            echo "5. Click 'Add secret'"
            echo ""
            echo "⚠️  Note: Secret names are case-sensitive!"
            echo "⚠️  Make sure there are no extra spaces in the name!"
          else
            echo "✓ WalletConnect Project ID is configured"
            echo "✓ Secret length: ${#WALLETCONNECT_PROJECT_ID} characters"
          fi
        env:
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}      
      - name: Build web app with Turbo
        run: yarn dlx turbo@latest run build --filter=@biet-network/web
        env:
          GITHUB_ACTIONS: 'true'
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_BIET_IDENTITY_ADDRESS: ${{ vars.BIET_IDENTITY_ADDRESS }}
          NEXT_PUBLIC_BGT_TOKEN_ADDRESS: ${{ vars.BGT_TOKEN_ADDRESS }}
          NEXT_PUBLIC_BGT_SALE_ADDRESS: ${{ vars.BGT_SALE_ADDRESS }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/docs

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
